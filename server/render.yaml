# Render Blueprint — optional, but lets Render auto-configure this service
# if you use "New + Blueprint" instead of manually creating a Web Service.
services:
  - type: web
    name: mini-crm-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PORT
        value: 5000
